services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creators_learning
      POSTGRES_USER: creators
      POSTGRES_PASSWORD: creators_local_password
    ports:
      - "5432:5432"
    volumes:
      - creators-postgres:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  creators-postgres:
